<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KK • 导航。提供高效的搜索、云端自定义网址管理、动态天气与专属壁纸等个性化功能。">
    <meta name="keywords" content="网址导航, 开发者导航, 智能导航, 响应式网站, 云端同步">
    <title id="page-title">KK • 导航</title>
    
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }

        body.theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }

        body.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        body, .glass-card, .glass-input, #custom-links-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed #6366f1 !important;
        }

        body:not(.is-admin) .admin-only {
            display: none !important;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 1rem 1.5rem 1.5rem 1.5rem;
        }
        .nav-grid-wrapper {
            flex: 1 0 auto;
            margin-bottom: 2rem;
        }
        .search-wrapper {
            flex-shrink: 0;
            width: 100%;
            max-width: 48rem;
            margin: 0 auto;
        }
        .nav-container .max-w-7xl {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        #main-nav-grid {
            gap: 1.5rem;
        }
        .search-wrapper .glass-input {
            border-radius: 2rem;
        }
        footer {
            margin-top: 1rem;
        }

        .link-tooltip-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            overflow: visible !important;
        }
        .link-tooltip-wrapper .tooltip-text {
            visibility: hidden;
            width: 220px;
            background-color: #1e293b;
            color: #f1f5f9;
            text-align: left;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.4;
            position: absolute;
            z-index: 200;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            pointer-events: none;
            word-break: break-word;
            white-space: normal;
        }
        .link-tooltip-wrapper .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }
        .link-tooltip-wrapper:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        body.theme-light .link-tooltip-wrapper .tooltip-text {
            background-color: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }
        body.theme-light .link-tooltip-wrapper .tooltip-text::after {
            border-color: #f1f5f9 transparent transparent transparent;
        }

        .edit-desc-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .group:hover .edit-desc-btn {
            opacity: 0.6;
        }
        .group:hover .edit-desc-btn:hover {
            opacity: 1;
        }
        .glass-card,
        .group,
        #custom-links-container > div {
            overflow: visible !important;
        }

        .engine-menu-wrapper {
            position: relative;
            overflow: visible !important;
        }
        #engine-menu {
            position: absolute;
            left: 0;
            bottom: calc(100% + 8px);
            top: auto !important;
            width: 11rem;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: none;
            backdrop-filter: blur(12px);
            overflow: hidden;
            z-index: 110;
            padding: 4px 0;
        }
        #engine-menu.show {
            display: block;
        }
        body.theme-light #engine-menu {
            background-color: #ffffff;
            border-color: #e2e8f0;
        }
        body.theme-light #engine-menu button {
            color: #334155;
        }
        body.theme-light #engine-menu button:hover {
            background: rgba(79, 70, 229, 0.08);
        }
        #engine-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 8px 14px;
            font-size: 0.875rem;
            color: #e2e8f0;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            gap: 8px;
        }
        #engine-menu button:hover {
            background: rgba(99, 102, 241, 0.15);
        }
        #engine-menu button i {
            width: 18px;
            text-align: center;
        }
        #engine-menu::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid #1e293b;
        }
        body.theme-light #engine-menu::after {
            border-top-color: #ffffff;
        }
        .search-wrapper .relative,
        .search-wrapper .glass-input,
        .search-wrapper .flex {
            overflow: visible !important;
        }
    </style>
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 个性化设置浮窗 -->
    <div class="fixed top-5 right-5 z-[150] relative">
        <button aria-label="个性化设置" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-500 hover:scale-105 active:scale-95 transition-all shadow-lg cursor-pointer" title="个性化设置">
            <i id="theme-icon" class="fas fa-palette text-sm"></i>
        </button>
        <div id="theme-panel" class="absolute right-0 top-full mt-2 w-60 bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160]" onclick="event.stopPropagation()">
            <div class="text-[11px] font-bold text-slate-400 px-1 mb-1.5" data-i18n="langTitle">语言 / Language</div>
            <div class="flex gap-2 mb-3 border-b border-slate-800 pb-3">
                <button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">中文</button>
                <button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">English</button>
            </div>

            <div class="text-[11px] font-bold text-slate-400 px-1" data-i18n="themeTitle">基础色彩模式 (本地偏好)</div>
            <div class="flex gap-2">
                <button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-sun text-amber-500"></i> <span data-i18n="themeLight">日间</span></button>
                <button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-moon text-indigo-400"></i> <span data-i18n="themeDark">夜间</span></button>
            </div>
            
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="bgTitle">自定义背景 (全站同步)</label>
                    <button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hover:underline hidden" data-i18n="clearBg">清除壁纸</button>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="custom-bg-input" data-i18n-placeholder="bgInputPlace" placeholder="输入图片网址 https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                </div>
            </div>
            
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <label class="text-[11px] text-slate-400 font-bold" data-i18n="pwdTitle">修改管理员密码</label>
                <div class="flex gap-1.5">
                    <input type="password" id="custom-pwd-input" data-i18n-placeholder="pwdInputPlace" placeholder="输入新密码" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <button onclick="updateAdminPwd()" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-emerald-500 cursor-pointer shrink-0" data-i18n="saveBtn">保存</button>
                </div>
            </div>

            <div class="admin-only border-t border-slate-800 pt-2 mt-2">
                <button onclick="logoutAdmin()" class="w-full py-1.5 rounded-lg bg-red-950/40 border border-red-900/40 text-red-400 text-[11px] text-center hover:bg-red-900/40 transition-colors cursor-pointer" data-i18n="logoutBtn">退出后台管理</button>
            </div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="nav-container max-w-7xl mx-auto">
        
        <!-- 导航卡片网格 - 置顶 -->
        <div class="nav-grid-wrapper w-full">
            <div id="main-nav-grid" class="w-full grid grid-cols-1 xl:grid-cols-3 gap-6 mb-6 relative z-10 items-start">

                <!-- “添加自定义区域”按钮，恢复为原来大小 -->
                <div id="add-section-card" class="admin-only glass-card rounded-2xl p-5 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500/50 transition-all border-dashed border-2 border-slate-500/30 xl:col-span-1" onclick="addCustomSection()" style="min-height: 160px;">
                    <i class="fas fa-plus text-3xl text-slate-400 mb-2"></i>
                    <span class="text-sm font-medium text-slate-400 mt-1" data-i18n="addSectionBtn">添加自定义区域</span>
                </div>

            </div>
        </div>

        <!-- 搜索引擎组件 - 底部 -->
        <div class="search-wrapper w-full mb-2 relative z-[100]">
            <form id="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" class="relative">
                <div class="flex items-center glass-input rounded-full border border-slate-700/40 shadow-2xl focus-within:border-indigo-500/80 transition-all duration-300 px-1" style="overflow: visible !important;">
                    <div class="engine-menu-wrapper relative pl-3" style="overflow: visible !important;">
                        <button type="button" aria-label="切换搜索引擎" id="engine-btn" onclick="toggleEngineMenu(event)" class="flex items-center space-x-2 text-slate-400 hover:text-indigo-400 transition-colors py-3 pr-2 cursor-pointer">
                            <i id="engine-icon" class="fab fa-google text-blue-400"></i>
                            <i class="fas fa-chevron-down text-xs opacity-50"></i>
                        </button>
                        <!-- 搜索引擎菜单 -->
                        <div id="engine-menu">
                            <button type="button" onclick="selectEngine('google')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-google text-blue-400" style="width:18px;"></i> <span>Google 搜索</span></button>
                            <button type="button" onclick="selectEngine('baidu')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-paw text-red-400" style="width:18px;"></i> <span>百度搜索</span></button>
                            <button type="button" onclick="selectEngine('translate')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-language text-emerald-400" style="width:18px;"></i> <span>谷歌翻译</span></button>
                            <button type="button" onclick="selectEngine('yiso')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-search text-cyan-400" style="width:18px;"></i> <span>易搜</span></button>
                            <button type="button" onclick="selectEngine('youtube')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-youtube text-red-500" style="width:18px;"></i> <span>YouTube</span></button>
                            <button type="button" onclick="selectEngine('zlib')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-book text-amber-400" style="width:18px;"></i> <span>电子书</span></button>
                            <button type="button" onclick="selectEngine('wiki')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-wikipedia-w text-slate-300" style="width:18px;"></i> <span>WiKi</span></button>
                            <button type="button" onclick="selectEngine('github')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-github text-slate-400" style="width:18px;"></i> <span>GitHub</span></button>
                        </div>
                    </div>
                    <input type="text" id="search-input" name="q" data-i18n-placeholder="searchGoogle" placeholder="在 Google 中搜索..." autocomplete="off" class="w-full bg-transparent border-none py-3 px-3 focus:outline-none focus:ring-0 text-base">
                    <button type="submit" aria-label="搜索" class="mr-2 p-2 text-slate-400 hover:text-indigo-400 transition-colors">
                        <i class="fas fa-search text-lg"></i>
                    </button>
                </div>
            </form>
        </div>

        <footer id="admin-trigger" ondblclick="triggerAdminLogin()" class="text-slate-500 text-xs mt-3 cursor-pointer select-none tracking-wide hover:text-indigo-400/70 transition-colors text-center">
            <span data-i18n="footerText">&copy; KK • 导航 · Powered by Cloudflare</span> <span id="admin-badge" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold hidden" data-i18n="adminBadge">已登入</span>
        </footer>
    </div>

    <!-- 弹窗模态框 -->
    <div id="modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[300]" onclick="closeModalOnBlank(event)">
        <div class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-slate-100" onclick="event.stopPropagation()">
            <h4 id="modal-title" class="text-md font-semibold text-slate-200 mb-4 flex items-center"><i class="fas fa-link mr-2 text-indigo-400"></i><span id="modal-title-text">添加网址</span></h4>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteName">网站名称</label>
                    <input type="text" id="site-name" data-i18n-placeholder="siteNamePlace" placeholder="例如：百度" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteUrl">网站网址 (URL)</label>
                    <input type="text" id="site-url" placeholder="https://zh.wikipedia.org/wiki/" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteDesc">备注 / 描述 (悬浮时显示)</label>
                    <input type="text" id="site-desc" placeholder="例如：这是一个常用的开发文档网站" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs font-medium rounded-xl hover:bg-slate-700 transition-colors cursor-pointer" data-i18n="btnCancel">取消</button>
                <button type="button" onclick="saveActiveLink()" class="px-4 py-2 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-500 transition-colors cursor-pointer shadow-lg shadow-indigo-600/20" data-i18n="btnSave">保存站点</button>
            </div>
        </div>
    </div>

    <!-- 编辑备注的微型弹窗 -->
    <div id="edit-desc-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[400]" onclick="closeEditDescModal(event)">
        <div class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-slate-100" onclick="event.stopPropagation()">
            <h4 class="text-md font-semibold text-slate-200 mb-4 flex items-center"><i class="fas fa-pen mr-2 text-indigo-400"></i>编辑备注</h4>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium">备注内容 (悬浮时显示)</label>
                    <input type="text" id="edit-desc-input" placeholder="请输入备注..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="closeEditDescModal()" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs font-medium rounded-xl hover:bg-slate-700 transition-colors cursor-pointer" data-i18n="btnCancel">取消</button>
                <button type="button" onclick="saveEditDesc()" class="px-4 py-2 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-500 transition-colors cursor-pointer shadow-lg shadow-indigo-600/20">保存备注</button>
            </div>
        </div>
    </div>

    <script>
        // --- 0. 全局状态与配置 ---
        let currentLang = localStorage.getItem('nav_lang') || 'zh';
        let isCustomLinksExpanded = false;
        let expandedDynamicSections = {}; 
        let currentModalTarget = 'custom'; 
        let currentEngineKey = 'google';
        let editingLinkRef = null;
        
        let cloudConfig = { wallpaper: "", dynamicSections: [], adminPwd: "" };

        let dragType = null; 
        let dragSecId = null; 
        let dragLinkIdx = null;

        const i18n = {
            zh: {
                pageTitle: "KK • 导航", langTitle: "语言 / Language", themeTitle: "基础色彩模式 (本地偏好)",
                themeLight: "日间", themeDark: "夜间", bgTitle: "自定义背景 (全站同步)", bgInputPlace: "输入图片网址 https://...",
                applyBtn: "应用", clearBg: "清除壁纸", logoutBtn: "退出后台管理", 
                searchGoogle: "在 Google 中搜索...", searchBaidu: "在 百度 中搜索...", searchTranslate: "输入要翻译的文本...", searchYiso: "在 易搜 中搜索...", searchYoutube: "在 YouTube 中搜索...", searchZlib: "在 Z-Library 中搜索...", searchWiki: "在 WiKi 中搜索...", searchGithub: "在 GitHub 中搜索仓库...",
                cardCustom: "快捷应用", 
                addCloud: "添加 (云端)", expandMore: "展开显示更多", collapseMore: "收起部分站点",
                footerText: "&copy; KK • 导航 · Powered by Cloudflare", adminBadge: "已登录",

        // --- 拖拽核心逻辑 ---
        function handleDragStart(e, type, secId, linkIdx = null) {
            e.stopPropagation(); 
            if (localStorage.getItem('nav_admin_auth') !== 'true') { 
                e.preventDefault(); 
                return; 
            }
            dragType = type; 
            dragSecId = secId; 
            dragLinkIdx = linkIdx;
            e.dataTransfer.effectAllowed = 'move';
            const target = e.currentTarget;
            setTimeout(() => target.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            e.stopPropagation(); 
            e.currentTarget.classList.remove('dragging');
            // 清除所有可能的拖拽高亮边框
            document.querySelectorAll('.dynamic-section-card, .group').forEach(el => el.style.border = '');
        }

        function handleDragOver(e, type) { 
            e.preventDefault(); 
            e.stopPropagation(); 
            e.dataTransfer.dropEffect = 'move'; 
            return false; 
        }

        function handleDrop(e, type, targetSecId, targetLinkIdx = null) {
            e.stopPropagation(); 
            e.preventDefault();
            if (localStorage.getItem('nav_admin_auth') !== 'true') return;

            // 如果没有正在拖拽的内容，直接返回
            if (!dragType) return;

            let secs = cloudConfig.dynamicSections || [];

            // 处理卡片拖拽 (section -> section)
            if (dragType === 'section' && type === 'section') {
                if (dragSecId === targetSecId) return;
                const fromIdx = secs.findIndex(s => s.id === dragSecId);
                const toIdx = secs.findIndex(s => s.id === targetSecId);
                if(fromIdx > -1 && toIdx > -1) {
                    const [moved] = secs.splice(fromIdx, 1);
                    secs.splice(toIdx, 0, moved);
                    saveDynamicSections(secs);
                }
                // 重置拖拽状态
                dragType = null;
                return;
            }

            // 处理链接拖拽 (link -> link)
            if (dragType === 'link' && type === 'link') {
                // 如果拖拽的是同一个卡片中的同一个链接，不做任何事
                if (dragSecId === targetSecId && dragLinkIdx === targetLinkIdx) {
                    dragType = null;
                    return;
                }
                const fromSec = secs.find(s => s.id === dragSecId);
                const toSec = secs.find(s => s.id === targetSecId);
                if (fromSec && toSec) {
                    // 确保目标索引有效
                    let actualTargetIdx = targetLinkIdx;
                    if (actualTargetIdx === null || actualTargetIdx === undefined) {
                        actualTargetIdx = toSec.links.length; // 放到末尾
                    }
                    // 从原位置删除
                    const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                    // 插入到目标位置
                    toSec.links.splice(actualTargetIdx, 0, movedLink);
                    saveDynamicSections(secs);
                }
                dragType = null;
                return;
            }

            // 处理链接拖拽到卡片 (link -> section)
            if (dragType === 'link' && type === 'section') {
                const fromSec = secs.find(s => s.id === dragSecId);
                const toSec = secs.find(s => s.id === targetSecId);
                if (fromSec && toSec) {
                    if (fromSec === toSec) {
                        dragType = null;
                        return;
                    }
                    const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                    toSec.links.push(movedLink);
                    saveDynamicSections(secs);
                }
                dragType = null;
                return;
            }

            // 其他情况重置拖拽状态
            dragType = null;
        }

            let savedBg = localStorage.getItem('nav_custom_wallpaper');

                    const configData = await res.json();
                    if (configData) {

                            if (configData.wallpaper === "") { savedBg = null; localStorage.removeItem('nav_custom_wallpaper'); document.body.classList.add('bg-cleared'); }

                        if (configData.dynamicSections) { cloudConfig.dynamicSections = configData.dynamicSections; localStorage.setItem('nav_dynamic_sections', JSON.stringify(cloudConfig.dynamicSections)); }
                        if (configData.adminPwd) { cloudConfig.adminPwd = configData.adminPwd; }

            if (!savedBg && !document.body.classList.contains('bg-cleared')) savedBg = globalDefaultBg;

            renderDynamicSections();
        }
