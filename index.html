    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 日间模式 (Light) 基础样式 */
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }

        /* 夜间模式 (Dark) 基础样式 */
        body.theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }

        /* 自定义壁纸激活状态的遮罩 */
        body.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* 全局过渡动画与拖拽交互支持 */
        body, .glass-card, .glass-input, #custom-links-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed #6366f1 !important;
        }

        /* 管理员权限控制类：默认非管理员隐藏编辑元素 */
        body:not(.is-admin) .admin-only {
            display: none !important;
        }

        /* 布局调整：导航在上，搜索在下，紧凑无空白 */
        .nav-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 1rem 1.5rem 1.5rem 1.5rem;
        }
        .nav-grid-wrapper {
            flex: 1 0 auto;
            margin-bottom: 2rem;
        }
        .search-wrapper {
            flex-shrink: 0;
            width: 100%;
            max-width: 48rem;
            margin: 0 auto;
        }
        /* 移除顶部多余间距 */
        .nav-container .max-w-7xl {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        /* 调整卡片间距 */
        #main-nav-grid {
            gap: 1.5rem;
        }
        /* 让底部搜索框更紧凑 */
        .search-wrapper .glass-input {
            border-radius: 2rem;
        }
        footer {
            margin-top: 1rem;
        }

        /* 网址悬浮提示框 (Tooltip) 样式 - 修正鼠标指针为默认 */
        .link-tooltip {
            position: relative;
            display: inline-block;
            /* 移除 cursor: help，使用默认指针 */
        }
        .link-tooltip .tooltip-text {
            visibility: hidden;
            width: 220px;
            background-color: #1e293b;
            color: #f1f5f9;
            text-align: left;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.4;
            position: absolute;
            z-index: 200;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            pointer-events: none;
            word-break: break-word;
            white-space: normal;
        }
        .link-tooltip .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }
        .link-tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        /* 针对日间模式的适配 */
        body.theme-light .link-tooltip .tooltip-text {
            background-color: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }
        body.theme-light .link-tooltip .tooltip-text::after {
            border-color: #f1f5f9 transparent transparent transparent;
        }
    </style>
</head>

        // --- 2. 拖拽核心控制逻辑 ---
        function handleDragStart(e, type, secId, linkIdx = null) {
            e.stopPropagation(); 
            if (localStorage.getItem('nav_admin_auth') !== 'true') { e.preventDefault(); return; }
            dragType = type; dragSecId = secId; dragLinkIdx = linkIdx;
            e.dataTransfer.effectAllowed = 'move';
            const target = e.currentTarget;
            setTimeout(() => target.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            e.stopPropagation(); 
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.dynamic-section-card, .group').forEach(el => el.style.border = '');
        }

        function handleDragOver(e, type) { 
            e.preventDefault(); 
            e.stopPropagation(); 
            e.dataTransfer.dropEffect = 'move'; 
            return false; 
        }

        function handleDrop(e, type, targetSecId, targetLinkIdx = null) {
            e.stopPropagation(); 
            e.preventDefault();
            if (localStorage.getItem('nav_admin_auth') !== 'true') return;

            let secs = cloudConfig.dynamicSections || [];

            if (dragType === 'section' && type === 'section') {
                if (dragSecId === targetSecId) return;
                const fromIdx = secs.findIndex(s => s.id === dragSecId);
                const toIdx = secs.findIndex(s => s.id === targetSecId);
                if(fromIdx > -1 && toIdx > -1) {
                    const [moved] = secs.splice(fromIdx, 1);
                    secs.splice(toIdx, 0, moved);
                }
            } 
            else if (dragType === 'link' && type === 'link') {
                if (dragSecId === targetSecId && dragLinkIdx === targetLinkIdx) return;
                const fromSec = secs.find(s => s.id === dragSecId);
                const toSec = secs.find(s => s.id === targetSecId);
                if (fromSec && toSec) {
                    let actualTargetIdx = targetLinkIdx;
                    const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                    toSec.links.splice(actualTargetIdx, 0, movedLink);
                }
            } 
            else if (dragType === 'link' && type === 'section') {
                 const fromSec = secs.find(s => s.id === dragSecId);
                 const toSec = secs.find(s => s.id === targetSecId);
                 if (fromSec && toSec) {
                     if (fromSec === toSec) return; 
                     const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                     toSec.links.push(movedLink);
                 }
            }
            saveDynamicSections(secs);
        }

        // --- 3. 云端调度器 (新增 adminPwd 同步) ---
        async function initCloudData() {
            const savedTheme = localStorage.getItem('nav_theme_mode') || 'theme-dark';
            document.body.classList.remove('theme-light', 'theme-dark'); document.body.classList.add(savedTheme);
            const globalDefaultBg = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop"; 
            let savedBg = localStorage.getItem('nav_custom_wallpaper');
            cloudConfig.dynamicSections = JSON.parse(localStorage.getItem('nav_dynamic_sections') || '[]');
            
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    const configData = await res.json();
                    if (configData) {
                        if (configData.wallpaper !== undefined) {
                            if (configData.wallpaper === "") { savedBg = null; localStorage.removeItem('nav_custom_wallpaper'); document.body.classList.add('bg-cleared'); } 
                            else { savedBg = configData.wallpaper; localStorage.setItem('nav_custom_wallpaper', savedBg); document.body.classList.remove('bg-cleared'); }
                        }
                        if (configData.dynamicSections) { cloudConfig.dynamicSections = configData.dynamicSections; localStorage.setItem('nav_dynamic_sections', JSON.stringify(cloudConfig.dynamicSections)); }
                        if (configData.adminPwd) { cloudConfig.adminPwd = configData.adminPwd; }
                    }
                }
            } catch (e) {}

            if (!savedBg && !document.body.classList.contains('bg-cleared')) savedBg = globalDefaultBg; 
            if (savedBg) { applyWallpaperStyles(savedBg); document.getElementById('custom-bg-input').value = savedBg; document.getElementById('clear-bg-btn').classList.remove('hidden'); }
            renderDynamicSections();
        }

        function toggleDynamicSectionExpand(secId) {
            expandedDynamicSections[secId] = !expandedDynamicSections[secId];

        function renderDynamicSections() {
            document.querySelectorAll('.dynamic-section-card').forEach(el => el.remove());
            const grid = document.getElementById('main-nav-grid');
            const addBtnCard = document.getElementById('add-section-card');
            let secs = cloudConfig.dynamicSections || [];

            secs.forEach((sec) => {
                const isExpanded = !!expandedDynamicSections[sec.id];
                const linkCount = sec.links.length;
                const isCompact = linkCount > 6;

                let gridCols = isCompact ? 'grid-cols-3 gap-2' : 'grid-cols-2 gap-3';
                let visibleLinks = sec.links;
                let showExpandBtn = false;

                if (linkCount > 9) {
                    showExpandBtn = true;

                        visibleLinks = sec.links.slice(0, 9);
                    }
                }

                card.className = "dynamic-section-card glass-card rounded-2xl p-5 shadow-xl hover:border-indigo-500/30 transition-all duration-300 relative xl:col-span-1";
                card.id = `section-${sec.id}`;
                card.draggable = true;

                card.ondragend = handleDragEnd;
                card.ondragover = (e) => handleDragOver(e, 'section');
                card.ondrop = (e) => handleDrop(e, 'section', sec.id);

                let linksHtml = '';

                    const imgSizeClass = isCompact ? 'w-4 h-4' : 'w-5 h-5';
                    const textSizeClass = isCompact ? 'text-[11px]' : 'text-sm';
                    const prClass = isCompact ? 'pr-4' : 'pr-5';

                    visibleLinks.forEach((link, idx) => {
                        const displayName = getLocalizedLinkName(link.name, link.url);

                        try { if(link.url) displayIcon = `<img src="https://unavatar.io/duckduckgo/${new URL(link.url).hostname}" draggable="false" onerror="this.style.display='none'" class="${imgSizeClass} rounded object-contain shrink-0" alt="icon" />`; } catch(e){}

                        linksHtml += `
                        <div class="group relative flex items-center justify-between ${pClass} bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-indigo-600/10 transition-all"
                             draggable="true"
                             ondragstart="handleDragStart(event, 'link', '${sec.id}', ${idx})"
                             ondragend="handleDragEnd(event)"
                             ondragover="handleDragOver(event, 'link')"
                             ondrop="handleDrop(event, 'link', '${sec.id}', ${idx})">
                            <div class="flex items-center w-full overflow-hidden">
                                <i class="fas fa-grip-vertical text-slate-500 opacity-0 group-hover:opacity-50 transition-opacity ${dragMrClass} cursor-move admin-only text-[10px] shrink-0"></i>
                                <a href="${link.url}" draggable="false" target="_blank" rel="noopener noreferrer" class="flex items-center ${spaceXClass} truncate w-full ${prClass} link-tooltip">
                                    ${displayIcon} <span class="${textSizeClass} font-medium truncate">${displayName}</span>
                                    ${description ? `<span class="tooltip-text">${description}</span>` : ''}
                                </a>
                            </div>
                            <button type="button" onclick="deleteSectionLink(event, '${sec.id}', ${idx})" class="admin-only absolute ${btnClass} text-slate-400 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-500/20 rounded cursor-pointer shrink-0"><i class="fas fa-trash-alt"></i></button>
                        </div>`;
                    });
                }

                let expandHtml = '';
                if (showExpandBtn) {
                    const btnText = isExpanded
                        ? `<span data-i18n="collapseMore">${t('collapseMore')}</span> <i class="fas fa-chevron-up text-[10px]"></i>`
                        : `<span data-i18n="expandMore">${t('expandMore')}</span> (${linkCount - 9}) <i class="fas fa-chevron-down text-[10px]"></i>`;
                    expandHtml = `
                        <div class="mt-3 pt-2 border-t border-slate-500/10 text-center">
                            <button type="button" onclick="toggleDynamicSectionExpand('${sec.id}')" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors cursor-pointer inline-flex items-center gap-1">
                                ${btnText}

                        </div>

                }

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-lg font-semibold text-indigo-400 flex items-center cursor-move" title="长按拖拽排序" style="cursor: grab;">
                            <i class="fas fa-grip-vertical mr-2 text-slate-500 opacity-60 admin-only text-sm"></i>
                            <i class="fas fa-layer-group mr-2.5"></i> <span>${sec.title}</span>
                        </h3>
                        <div class="flex gap-1.5 shrink-0 ml-2">

                            <button type="button" onclick="renameCustomSection('${sec.id}')" class="admin-only text-[10px] px-2 py-1 bg-sky-600/20 text-sky-400 border border-sky-500/20 rounded-md hover:bg-sky-600/40 transition-colors cursor-pointer z-[50]"><i class="fas fa-pen"></i></button>
                            <button type="button" onclick="deleteCustomSection('${sec.id}')" class="admin-only text-[10px] px-2 py-1 bg-red-600/20 text-red-400 border border-red-500/20 rounded-md hover:bg-red-600/40 transition-colors cursor-pointer z-[50]"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="grid ${gridCols}" style="min-height: 40px;" ondragover="handleDragOver(event, 'section')" ondrop="handleDrop(event, 'section', '${sec.id}')">
                        ${linksHtml}
                    </div>
                    ${expandHtml}

                grid.insertBefore(card, addBtnCard);
            });

        async function saveActiveLink() {
            const name = document.getElementById('site-name').value.trim(); 
            let url = document.getElementById('site-url').value.trim();
            const desc = document.getElementById('site-desc').value.trim(); // 获取描述
            if(!name || !url) return alert(currentLang === 'zh' ? '请完整填写名称和网址！' : 'Please fill in both name and URL!');
            if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

            const newLink = { name, url, desc }; // 包含 desc

            if (currentModalTarget.startsWith('section_')) {
                const secId = currentModalTarget.replace('section_', ''); 
                let secs = cloudConfig.dynamicSections || []; 
                const sec = secs.find(s => s.id === secId);
                if(sec) { sec.links.push(newLink); saveDynamicSections(secs); }
            } else if(currentModalTarget === 'friend') {
                // friend 功能已移除
            } else {
                try { 
                    const res = await fetch('/api/links'); 
                    let links = res.ok ? await res.json() : JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); 
                    links.push(newLink); 
                    await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(links) }); 
                    localStorage.setItem('nav_custom_links', JSON.stringify(links)); 
                    loadCustomLinks(); 
                } 
                catch (error) { 
                    const links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); 
                    links.push(newLink); 
                    localStorage.setItem('nav_custom_links', JSON.stringify(links)); 
                    loadCustomLinks(); 
                }
            } 
            toggleModal(false);
        }

        async function loadCustomLinks() {
            const container = document.getElementById('custom-links-container'); const actionWrapper = document.getElementById('expand-action-wrapper');
            container.innerHTML = `<div class="col-span-full text-center text-xs text-slate-400/60 py-10"><i class="fas fa-spinner fa-spin"></i> ${t('loadingCloud')}</div>`;
            let links = []; try { const res = await fetch('/api/links'); if(res.ok) links = await res.json(); else throw new Error(); } catch(e) { links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); }
            container.innerHTML = '';
            
            if(links.length === 0) { 
                container.innerHTML = `<div class="col-span-full text-center text-xs text-slate-400/60 py-10">${t('noCloudLinks')}</div>`; 
                actionWrapper.classList.add('hidden'); 
                container.className = 'grid grid-cols-2 gap-3';
                return; 
            }

            const isCompact = links.length > 6;
            container.className = isCompact ? 'grid grid-cols-3 gap-2' : 'grid grid-cols-2 gap-3';

            let visibleLinks = links;
            let showExpandBtn = false;
            if (links.length > 9) { showExpandBtn = true; if (!isCustomLinksExpanded) visibleLinks = links.slice(0, 9); }

            const pClass = isCompact ? 'p-2' : 'p-3'; const spaceXClass = isCompact ? 'space-x-1.5' : 'space-x-2.5';
            const iconSizeClass = isCompact ? 'w-4 h-4 text-[9px]' : 'w-5 h-5 text-[10px]'; const imgSizeClass = isCompact ? 'w-4 h-4' : 'w-5 h-5';
            const textSizeClass = isCompact ? 'text-[11px]' : 'text-sm'; const prClass = isCompact ? 'pr-4' : 'pr-5'; const btnClass = isCompact ? 'right-1 text-[10px] px-1 py-0.5' : 'right-2 text-xs p-1';

            visibleLinks.forEach((item, index) => {
                const displayName = getLocalizedLinkName(item.name, item.url);
                const description = item.desc || '';
                let displayIcon = `<div class="${iconSizeClass} rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold shrink-0">${displayName.charAt(0).toUpperCase()}</div>`;
                try { if(item.url) displayIcon = `<img src="https://unavatar.io/duckduckgo/${new URL(item.url).hostname}" draggable="false" onerror="this.style.display='none'" class="${imgSizeClass} rounded object-contain shrink-0" alt="icon" />`; } catch(err){}
                
                container.innerHTML += `
                    <div class="group relative flex items-center justify-between ${pClass} bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-indigo-600/10 transition-all">
                        <div class="flex items-center w-full overflow-hidden">
                            <a href="${item.url}" draggable="false" target="_blank" rel="noopener noreferrer" class="flex items-center ${spaceXClass} truncate w-full ${prClass} link-tooltip">
                                ${displayIcon} <span class="${textSizeClass} font-medium truncate">${displayName}</span>
                                ${description ? `<span class="tooltip-text">${description}</span>` : ''}
                            </a>
                        </div>
                        <button type="button" onclick="deleteCustomLink(event, ${index})" class="admin-only absolute ${btnClass} text-slate-400 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-500/20 rounded cursor-pointer shrink-0"><i class="fas fa-trash-alt"></i></button>
                    </div>`;
            });

            if (showExpandBtn) { 
                actionWrapper.classList.remove('hidden'); const btn = document.getElementById('expand-btn'); 
                btn.innerHTML = isCustomLinksExpanded ? `<span data-i18n="collapseMore">${t('collapseMore')}</span> <i class="fas fa-chevron-up text-[10px]"></i>` : `<span data-i18n="expandMore">${t('expandMore')}</span> (${links.length - 9}) <i class="fas fa-chevron-down text-[10px]"></i>`; 
            } else { actionWrapper.classList.add('hidden'); }
        }

        function toggleExpandCustomLinks() { isCustomLinksExpanded = !isCustomLinksExpanded; loadCustomLinks(); }
        async function deleteCustomLink(e, index) { e.preventDefault(); e.stopPropagation(); if(!confirm(t('delConfirm'))) return; try { const res = await fetch('/api/links'); let links = res.ok ? await res.json() : JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); links.splice(index, 1); await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(links) }); localStorage.setItem('nav_custom_links', JSON.stringify(links)); if(links.length <= 9) isCustomLinksExpanded = false; loadCustomLinks(); } catch(error) { const links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); links.splice(index, 1); localStorage.setItem('nav_custom_links', JSON.stringify(links)); if(links.length <= 9) isCustomLinksExpanded = false; loadCustomLinks(); } }

        // --- 初始化运转 ---
        document.addEventListener('click', () => { document.getElementById('engine-menu').classList.add('hidden'); document.getElementById('theme-panel').classList.add('hidden'); });
        checkAdminSession(); document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en'; applyLanguage(); initCloudData();
    </script>
</body>
</html>
